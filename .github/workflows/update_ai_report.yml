name: AI Quant Trading Report v8.5

on:
  schedule:
    # 每週一到五 UTC 09:00 執行（台灣時間 17:00 收盤後）
    - cron: '0 9 * * 1-5'
    # 每月 1 日 UTC 10:00 跑月報
    - cron: '0 10 1 * *'
  # 程式碼變動時跑測試閘門（push/PR）
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tp_atr:
        description: 'ATR 停利倍數'
        required: false
        default: '4.0'
      sl_atr:
        description: 'ATR 停損倍數'
        required: false
        default: '2.5'
      hold_days:
        description: '最大持倉天數'
        required: false
        default: '15'
      top_k:
        description: '每日最多進場股票數'
        required: false
        default: '7'
      days:
        description: '回測天數'
        required: false
        default: '1200'
      gap_filter:
        description: '跳空過濾 ATR 倍數'
        required: false
        default: '1.5'

# 防止多個 run 同時 push 造成 race condition
concurrency:
  group: ai-report-main
  cancel-in-progress: false

jobs:
  # 測試閘門：所有事件都先跑，報表 job 透過 needs 依賴它
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies (runtime + dev)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (critical errors only)
        run: ruff check .

      - name: Look-ahead bias static check
        run: python verify_strategy.py

      - name: Unit tests
        run: pytest

  generate-report:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 完整 history，避免 rebase 問題

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Quant Pipeline v8.5
        if: github.event.schedule != '0 10 1 * *'
        run: |
          python ai_report.py \
            --regime-filter \
            --regime-graduated \
            --breadth-regime \
            --regime-floor 0.10 \
            --trailing \
            --trailing-atr 2.5 \
            --tp-atr ${{ github.event.inputs.tp_atr || '4.0' }} \
            --sl-atr ${{ github.event.inputs.sl_atr || '2.5' }} \
            --hold-days ${{ github.event.inputs.hold_days || '15' }} \
            --top-k ${{ github.event.inputs.top_k || '7' }} \
            --gap-filter ${{ github.event.inputs.gap_filter || '1.5' }} \
            --days ${{ github.event.inputs.days || '1200' }}

      - name: Paper Trading Tracker
        if: github.event.schedule != '0 10 1 * *'
        run: python paper_tracker.py

      - name: Monthly Paper Trading Report
        if: github.event.schedule == '0 10 1 * *'
        run: python paper_trade.py monthly

      - name: Cleanup old artifacts (keep last 180 days)
        run: |
          if [ -d "artifacts" ]; then
            find artifacts/ -type f -mtime +180 -delete 2>/dev/null || true
          fi

      - name: Commit and push
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # 只 stage 已知產出檔（白名單），避免 git add -A 把暫存/中繼檔推進 main
          # 注意：stock_names_cache.json 也要納入白名單，否則它被 get_stock_names()
          # 重寫後會以「已追蹤但未 stage」殘留，使後續 git rebase 因 unstaged changes 失敗。
          for f in stock_report.html paper_trading.html paper_equity.json \
                   paper_signals.json paper_trades.json backtest_chart.png \
                   data/stock_names_cache.json; do
            [ -e "$f" ] && git add "$f"
          done
          [ -d artifacts ] && git add artifacts/
          git commit -m "📊 AI Report v8.5 + Paper Trading ($(date -u '+%Y-%m-%d'))" || echo "No changes"

          # 安全 rebase + push：--autostash 容忍零星 unstaged 變更；衝突則 abort 後重試
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then echo "✅ pushed"; pushed=true; break; fi
            else
              echo "⚠️ rebase 衝突，abort 後重試 ($attempt/3)"; git rebase --abort || true
            fi
            sleep 5
          done
          # 防呆：push 未成功就讓步驟紅燈，避免再次「綠燈卻靜默停更」
          if [ "$pushed" != "true" ]; then echo "❌ push 失敗（重試 3 次）"; exit 1; fi

  # 每季第一週自動跑 sweep + Monte Carlo + Walk-Forward
  quarterly-health-check:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Check if quarterly (first week of Jan/Apr/Jul/Oct)
        id: check
        run: |
          DAY=$(date -u '+%d')
          MONTH=$(date -u '+%m')
          if [ "$DAY" -le 7 ] && ([ "$MONTH" = "01" ] || [ "$MONTH" = "04" ] || [ "$MONTH" = "07" ] || [ "$MONTH" = "10" ]); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Quick Sweep
        if: steps.check.outputs.run == 'true'
        run: python sweep.py --quick --output csv

      - name: Walk-Forward Validation
        if: steps.check.outputs.run == 'true'
        run: python walk_forward.py

      - name: Monte Carlo Stress Test (Block Bootstrap)
        if: steps.check.outputs.run == 'true'
        run: python monte_carlo.py --runs 2000 --block-size 5

      - name: Upload quarterly report
        if: steps.check.outputs.run == 'true'
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # 只 stage 結果檔（csv/png/md + artifacts），避免推入無關變動
          git add '*.csv' '*.png' '*.md' 2>/dev/null || true
          [ -d artifacts ] && git add artifacts/
          git commit -m "🔄 Quarterly health check ($(date -u '+%Y-%m-%d'))" || echo "No changes"

          # 安全 rebase + push：--autostash 容忍零星 unstaged 變更；衝突則 abort 後重試
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then echo "✅ pushed"; pushed=true; break; fi
            else
              echo "⚠️ rebase 衝突，abort 後重試 ($attempt/3)"; git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then echo "❌ push 失敗（重試 3 次）"; exit 1; fi
